services:
  voice-attributes:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Switch to "mock" for a dependency-free run with no model download.
      MODEL_BACKEND: ${MODEL_BACKEND:-wav2vec2}
      MODEL_NAME: ${MODEL_NAME:-audeering/wav2vec2-large-robust-24-ft-age-gender}
    volumes:
      # Persist downloaded model weights across restarts so they download once.
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
